paragraph=DC motors on a TB6612, MT6701 encoders and closed-loop axes with limits and slew, run by a fixed-rate control task. Every part describes itself into a TesserAPI tree, reachable over HTTP, WebSocket and serial, and drawn by TesserUI's web interface without UI code.
