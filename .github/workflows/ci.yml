name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure
